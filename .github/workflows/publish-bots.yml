name: Build bot binaries

on:
  push:
    branches: [main]
    paths:
      - 'DiscordBot.Console/**'
      - 'DiscordBot.GUI/**'
      - '.github/build-groups.json'
      - '.github/workflows/publish-bots.yml'
      - 'Directory.Build.*'
      - 'Directory.Packages.props'
      - 'global.json'
      - 'NuGet.config'
  pull_request:
    paths:
      - 'DiscordBot.Console/**'
      - 'DiscordBot.GUI/**'
      - '.github/build-groups.json'
      - '.github/workflows/publish-bots.yml'
      - 'Directory.Build.*'
      - 'Directory.Packages.props'
      - 'global.json'
      - 'NuGet.config'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-matrix:
    name: Discover publish targets
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6

      - id: targets
        name: Expand build manifest
        shell: bash
        run: |
          matrix='[]'

          while IFS= read -r group; do
            group_name="$(jq -r '.name' <<< "$group")"
            directory="$(jq -r '.directory' <<< "$group")"

            if [[ ! -d "$directory" ]]; then
              continue
            fi

            while IFS= read -r -d '' project; do
              project_name="$(basename "$(dirname "$project")")"
              artifact_name="${group_name}-$(tr '[:upper:]' '[:lower:]' <<< "$project_name")"

              while IFS= read -r target; do
                matrix="$(jq -cn \
                  --argjson current "$matrix" \
                  --arg name "$artifact_name" \
                  --arg project "$project" \
                  --argjson target "$target" \
                  '$current + [($target + { name: $name, project: $project })]')"
              done < <(jq -c '.targets[]' <<< "$group")
            done < <(find "$directory" -mindepth 2 -maxdepth 2 -type f -name '*.csproj' -print0)
          done < <(jq -c '.groups[]' .github/build-groups.json)

          test "$matrix" != "[]"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  publish:
    name: ${{ matrix.name }} (${{ matrix.rid }})
    needs: create-matrix
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.create-matrix.outputs.targets) }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Publish Native AOT binary
        shell: bash
        run: |
          output_directory="artifacts/${{ matrix.name }}/${{ matrix.rid }}"
          dotnet publish "${{ matrix.project }}" \
            --configuration Release \
            --runtime "${{ matrix.rid }}" \
            --self-contained true \
            --output "$output_directory"

          mkdir -p dist
          tar -czf "dist/${{ matrix.name }}-${{ matrix.rid }}.tar.gz" -C "$output_directory" .

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}-${{ matrix.rid }}
          path: dist/${{ matrix.name }}-${{ matrix.rid }}.tar.gz
          if-no-files-found: error
          retention-days: 14
